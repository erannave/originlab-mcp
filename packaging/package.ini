; OriginMCP package manifest — the source of record for the shipped OPX.
;
; DO NOT MOVE THIS FILE TO THE REPO ROOT. mkOPX/Code Builder pack the ENTIRE
; folder that contains package.ini (OPXFile::InitFromIni -> AddFolder(srcPath),
; and the [Files] SourcePath key below is ignored in favour of that folder), so
; a package.ini in the root would bundle vendor\ (~112 MB) and .git — a ~93 MB
; OPX that hangs Origin. build.ogs copies this file plus the shipped files into
; a clean staging folder and runs mkOPX there.
;
; ASCII only: Origin writes its own package.ini as UTF-16, but the Win32 INI
; reader handles a plain ASCII file identically, and ASCII keeps git diffs sane.

[Package]
Type=1
Name=OriginMCP
; Keep Name without a space: it derives the install folder (Apps\OriginMCP\),
; which must match the dev folder. A space previously produced a stray
; "Origin MCP" folder and a duplicate entry in Origin's OPXList.xml.
Description=Runs an MCP (Model Context Protocol) server as a background sidecar so AI clients can drive this Origin instance.
Version=1.20
Author=Batalyse GmbH
Keywords=MCP,Model Context Protocol,AI,automation,LabTalk,Claude
Category=Utilities

[Origin]
; 10.10 == Origin 2024, the oldest release verified to bundle Python 3.11.
; This MUST NOT be lowered below the Python 3.10 floor that setup() enforces
; (the mcp package needs 3.10+): Origin 2022b ships Python 3.8, so an install
; Origin allowed there would be rejected by the version gate in manage.py.
; Note 10.10 and 10.1 are the same number — Origin renders it with two decimals.
Version=10.10
Pro=0

[App]
Icon=AppIcon.png
ToolbarIcon=
LaunchScript=launch.ogs
ShowApp=1

[AppEnable]
Always=1
Graph=1
Workbook=1
Matrixbook=1
Image=1
Excel=1
Layout=1
LabTalkExp=

[Toolbar]
ButtonGroupFile=
Create=0

[LabTalk]
; These two hooks are load-bearing. Without AfterInstall the installed app never
; pip-installs its Python dependencies into vendor\ and the server never starts;
; without BeforeUninstall the sidecar keeps running (and keeps Origin
; "controlled by another application") after the app is removed.
BeforeInstall=
AfterInstall=run.section("%@A%@X\AfterInstall.ogs", main);
BeforeUninstall=run.section("%@A%@X\BeforeUninstall.ogs", main);

[Files]
EncryptC=0
LZ4=1
